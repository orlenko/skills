[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orlenko-agent-observer"
version = "0.1.0"
description = "Passive local observer for Claude and Codex session traces"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
agent-observer = "agent_observer.cli:main"

[tool.setuptools]
packages = ["agent_observer"]
